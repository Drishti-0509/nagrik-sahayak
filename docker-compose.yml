services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7-jammy
    container_name: nagrik_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nagrik_sahayak
    volumes:
      - mongodb_data:/data/db
    networks:
      - nagrik_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend API Service with ML Subsystem
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nagrik_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost
      CORS_ORIGINS: http://localhost,http://127.0.0.1
      MONGODB_URI: mongodb://mongodb:27017/nagrik_sahayak
      JWT_SECRET: ${JWT_SECRET:-nagrik_sahayak_prod_secret_key_minimum_32_characters_random}
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-2.5-flash
      DUPLICATE_SIMILARITY_THRESHOLD: 0.78
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      SMS_NOTIFICATIONS_ENABLED: ${SMS_NOTIFICATIONS_ENABLED:-false}
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nagrik_network

  # React Frontend Client (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nagrik_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - nagrik_network

volumes:
  mongodb_data:
    driver: local
  hf_cache:
    driver: local

networks:
  nagrik_network:
    driver: bridge
